name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # screenshots 后端在 Linux 上链接 XCB / D-Bus,runner 镜像未预装 -dev 包
      # (缺失时报 `rust-lld: error: unable to find library -lxcb`)。
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxcb1-dev libdbus-1-dev

      - name: Format check
        run: cargo fmt --all --check

      - name: Build (default features)
        run: cargo build --release

      - name: Test (default features)
        run: cargo test --release

      - name: Test (parallel)
        run: cargo test --release --features parallel

      - name: Test (all features) [windows]
        if: matrix.os == 'windows-latest'
        run: cargo test --release --all-features

      - name: Test (match-corr) [linux]
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --features match-corr

      - name: Test (match-corr + parallel) [linux]
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --features match-corr,parallel

      - name: Clippy (default features)
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Clippy (all features) [windows]
        if: matrix.os == 'windows-latest'
        run: cargo clippy --release --all-targets --all-features -- -D warnings

      - name: Clippy (match-corr) [linux]
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --release --all-targets --features match-corr -- -D warnings

      # 文档链接写错不会让编译失败(只会出 warning),所以单独把 rustdoc 的告警当错误。
      - name: Rustdoc (warnings are errors) [windows]
        if: matrix.os == 'windows-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Rustdoc (warnings are errors) [linux]
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --features match-corr,parallel,tracing
