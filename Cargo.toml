[package]
name = "pixhunt"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "Fast, low-dependency screen template matching: capture the screen and locate a small image, with pluggable capture backends (GDI / DXGI) and matchers (RGB / ZNCC)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/xiaoheliu1/pixhunt"
readme = "README.md"
keywords = ["template-matching", "screenshot", "computer-vision", "automation", "image-search"]
categories = ["computer-vision", "multimedia::images", "os"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
screenshots = "0.8"
corrmatch = { version = "0.1", features = ["simd"], optional = true }
rayon = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.51", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
criterion = "0.5"

# 仅示例 wait_and_click 使用:演示"pixhunt 看 + enigo 点"的分工,不进库依赖。
[target.'cfg(windows)'.dev-dependencies]
enigo = "0.6"

[[bench]]
name = "match"
harness = false

[features]
default = []
capture-gdi = ["dep:windows"]
capture-dxgi = ["dep:windows"]
capture-window = ["dep:windows"]
match-corr = ["dep:corrmatch"]
parallel = ["dep:rayon"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
